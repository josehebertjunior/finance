<div class="glass-panel" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
  <h2 style="margin-bottom: 1.5rem; text-align: center;">Novo Lançamento</h2>

  <form (ngSubmit)="save()" #f="ngForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
    
    <!-- Type selection -->
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button type="button" [ngStyle]="{'background': transaction.type === 0 ? 'var(--success)' : 'rgba(255,255,255,0.1)'}" (click)="transaction.type = 0" style="flex: 1; padding: 0.75rem; color: white; min-width: 120px;">Entrada (+)</button>
      <button type="button" [ngStyle]="{'background': transaction.type === 1 ? 'var(--danger)' : 'rgba(255,255,255,0.1)'}" (click)="transaction.type = 1" style="flex: 1; padding: 0.75rem; color: white; min-width: 120px;">Saída (-)</button>
      <button type="button" [ngStyle]="{'background': transaction.type === 2 ? 'var(--accent-primary)' : 'rgba(255,255,255,0.1)'}" (click)="transaction.type = 2" style="flex: 1; padding: 0.75rem; color: white; min-width: 120px;">Guardar (POUP)</button>
      <button type="button" [ngStyle]="{'background': transaction.type === 3 ? 'var(--warning)' : 'rgba(255,255,255,0.1)'}" (click)="transaction.type = 3" style="flex: 1; padding: 0.75rem; color: white; min-width: 120px;">Restgatar (POUP)</button>
    </div>

    <!-- Description -->
    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
      <label>Descrição</label>
      <input type="text" [(ngModel)]="transaction.description" name="description" required placeholder="Ex: Conta de Luz, Salário">
    </div>

    <!-- Amount -->
    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
      <label>Valor (R$)</label>
      <input type="number" step="0.01" [(ngModel)]="transaction.amount" name="amount" required>
    </div>

    <div style="display: flex; gap: 1rem;">
      <!-- Date -->
      <div style="flex: 1; display: flex; flex-direction: column; gap: 0.4rem;">
        <label>Data da compra</label>
        <input type="date" [(ngModel)]="transaction.date" name="date" required>
      </div>

      <!-- Reference Month -->
      <div style="flex: 1; display: flex; flex-direction: column; gap: 0.4rem;">
        <label>Mês / Fatura</label>
        <input type="month" [(ngModel)]="transaction.referenceMonth" name="referenceMonth" required>
      </div>
    </div>

    <div style="display: flex; gap: 1rem;">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 0.4rem;">
        <label>Categoria</label>
        <select [(ngModel)]="transaction.categoryId" name="categoryId">
          <option [ngValue]="null">Sem Categoria</option>
          <option *ngFor="let c of categories" [value]="c.id">{{c.name}}</option>
        </select>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; gap: 0.4rem;">
        <label>Método</label>
        <select [(ngModel)]="transaction.paymentMethodId" name="paymentMethodId">
          <option [ngValue]="null">Débito / Dinheiro</option>
          <option *ngFor="let pm of paymentMethods" [value]="pm.id">{{pm.name}}</option>
        </select>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; gap: 0.4rem;">
        <label>Pessoa</label>
        <select [(ngModel)]="transaction.personId" name="personId">
          <option [ngValue]="null">Nenhum</option>
          <option *ngFor="let p of persons" [value]="p.id">{{p.name}}</option>
        </select>
      </div>
    </div>

    <!-- Checkboxes for logic -->
    <div style="display: flex; flex-direction: column; gap: 1rem; background: rgba(0,0,0,0.2); padding: 1.25rem; border-radius: 8px;">
      
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <input type="checkbox" [(ngModel)]="isInstallment" name="isInstallment" id="isInstallment" style="width: 20px; height: 20px; accent-color: var(--accent-primary);">
        <label for="isInstallment" style="font-size: 1rem; color: white;">Conta Parcelada?</label>
      </div>

      <div *ngIf="isInstallment" style="display: flex; gap: 1rem; margin-left: 28px;">
        <div style="display: flex; flex-direction: column; gap: 0.4rem;">
          <label>Nº Total de Parcelas</label>
          <input type="number" min="2" [(ngModel)]="transaction.installmentTotal" name="installmentTotal">
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.4rem;">
          <label>Parcela Vigente (Atual)</label>
          <input type="number" min="1" [(ngModel)]="transaction.installmentCurrent" name="installmentCurrent">
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <input type="checkbox" [(ngModel)]="transaction.isFixed" name="isFixed" id="isFixed" style="width: 20px; height: 20px; accent-color: var(--accent-primary);">
        <label for="isFixed" style="font-size: 1rem; color: white;">Conta Fixa (se repete todo mês)?</label>
      </div>

    </div>

    <!-- Submit -->
    <button type="submit" class="primary" [disabled]="!f.valid" style="margin-top: 1rem; padding: 1rem; font-size: 1.1rem; font-weight: 600;">
      Salvar Lançamento
    </button>
  </form>
</div>
