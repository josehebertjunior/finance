<main>
  <div *ngIf="errorMessages.message()" class="app-alert" role="alert" aria-live="assertive">
    <span>{{ errorMessages.message() }}</span>
    <button type="button" aria-label="Fechar mensagem" (click)="errorMessages.clear()">&times;</button>
  </div>
  <nav *ngIf="showNav()" class="glass-panel app-nav">
    <h2 class="brand">
      <span>◆</span> Finanças
    </h2>
    <div class="nav-links">
      <a routerLink="/">Dashboard</a>
      <a routerLink="/new">Novo Lançamento</a>
      <a routerLink="/settings">Cadastros</a>
      <button type="button" class="link logout-button" (click)="logout()">Sair</button>
    </div>
  </nav>
  <section class="app-shell">
    <router-outlet></router-outlet>
  </section>
</main>
