<div class="auth-shell">
  <div class="auth-card glass-panel">
    <div class="auth-header">
      <div>
        <h1>Finanças Pessoais</h1>
        <p>Controle seus gastos, acompanhe suas receitas e organize seu orçamento.</p>
      </div>
    </div>

    <form *ngIf="view() === 'login'" (ngSubmit)="submitLogin()">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="loginEmail" required />
      <label>Senha</label>
      <input type="password" [(ngModel)]="password" name="loginPassword" required />
      <button type="submit" class="primary">Entrar</button>
    </form>

    <form *ngIf="view() === 'register'" (ngSubmit)="submitRegister()">
      <label>Nome</label>
      <input type="text" [(ngModel)]="displayName" name="displayName" required />
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="registerEmail" required />
      <label>Senha</label>
      <input type="password" [(ngModel)]="password" name="registerPassword" required />
      <label>Código do convite</label>
      <input type="text" [(ngModel)]="inviteCode" name="inviteCode" required />
      <p class="invite-note">Registro somente com convite válido enviado pelo administrador.</p>
      <button type="submit" class="secondary">Criar conta</button>
    </form>

    <form *ngIf="view() === 'forgot'" (ngSubmit)="submitForgot()">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="forgotEmail" required />
      <button type="submit" class="ghost">Enviar instruções</button>
    </form>

    <form *ngIf="view() === 'reset'" (ngSubmit)="submitReset()">
      <label>Código</label>
      <input type="text" [(ngModel)]="resetCode" name="resetCode" required />
      <label>Nova senha</label>
      <input type="password" [(ngModel)]="newPassword" name="newPassword" required />
      <button type="submit" class="primary">Redefinir senha</button>
    </form>

    <div *ngIf="auth.error()" class="auth-alert" [class.success]="auth.error() === 'Conta criada com sucesso. Faça login.' || auth.error() === 'Senha redefinida com sucesso. Faça login.'">
      {{ auth.error() }}
    </div>

    <div class="auth-footer">
      <button *ngIf="view() !== 'login'" type="button" class="link" (click)="switchView('login')">Voltar ao login</button>
      <button *ngIf="view() === 'login'" type="button" class="link" (click)="switchView('forgot')">Esqueci minha senha</button>
      <button *ngIf="view() !== 'register'" type="button" class="link" (click)="switchView('register')">Criar conta</button>
    </div>
  </div>
</div>
