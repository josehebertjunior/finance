<div class="auth-shell">
  <div class="auth-orb auth-orb-one"></div>
  <div class="auth-orb auth-orb-two"></div>
  <div class="auth-card">
    <div class="auth-header">
      <div>
        <span class="auth-kicker">◆ FINANÇAS</span>
        <h1>Seu dinheiro, com clareza.</h1>
        <p>Organize gastos, receitas e objetivos em um só lugar.</p>
      </div>
    </div>

    <form *ngIf="view() === 'login'" (ngSubmit)="submitLogin()">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="loginEmail" required />
      <label>Senha</label>
      <div class="password-field">
        <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="loginPassword" required />
        <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'">
          {{ showPassword() ? '◉' : '◌' }}
        </button>
      </div>
      <button type="submit" class="primary">Entrar</button>
    </form>

    <form *ngIf="view() === 'register'" (ngSubmit)="submitRegister()">
      <label>Nome</label>
      <input type="text" [(ngModel)]="displayName" name="displayName" required />
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="registerEmail" required />
      <label>Senha</label>
      <div class="password-field">
        <input [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="registerPassword" required />
        <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'">
          {{ showPassword() ? '◉' : '◌' }}
        </button>
      </div>
      <ng-container *ngIf="inviteCode(); else manualInviteCode">
        <p class="invite-note">Convite aplicado. Defina seus dados para finalizar o cadastro.</p>
      </ng-container>
      <ng-template #manualInviteCode>
        <label>Código do convite</label>
        <input type="text" [(ngModel)]="inviteCode" name="inviteCode" required />
        <p class="invite-note">Registro somente com convite válido enviado pelo administrador.</p>
      </ng-template>
      <button type="submit" class="secondary">Criar conta</button>
    </form>

    <form *ngIf="view() === 'forgot'" (ngSubmit)="submitForgot()">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="forgotEmail" required />
      <button type="submit" class="ghost">Enviar instruções</button>
    </form>

    <form *ngIf="view() === 'reset'" (ngSubmit)="submitReset()">
      <label>Código</label>
      <input type="text" [(ngModel)]="resetCode" name="resetCode" required />
      <label>Nova senha</label>
      <div class="password-field">
        <input [type]="showNewPassword() ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword" required />
        <button type="button" class="password-toggle" (click)="showNewPassword.set(!showNewPassword())" [attr.aria-label]="showNewPassword() ? 'Ocultar senha' : 'Mostrar senha'">
          {{ showNewPassword() ? '◉' : '◌' }}
        </button>
      </div>
      <button type="submit" class="primary">Redefinir senha</button>
    </form>

    <div *ngIf="auth.error()" class="auth-alert" [class.success]="auth.error() === 'Conta criada com sucesso. Faça login.' || auth.error() === 'Senha redefinida com sucesso. Faça login.'">
      {{ auth.error() }}
    </div>

    <div class="auth-footer">
      <button *ngIf="view() !== 'login'" type="button" class="link" (click)="switchView('login')">Voltar ao login</button>
      <button *ngIf="view() === 'login'" type="button" class="link" (click)="switchView('forgot')">Esqueci minha senha</button>
      <span *ngIf="view() === 'login'" class="invite-note">Acesso liberado por convite.</span>
    </div>
  </div>
</div>
